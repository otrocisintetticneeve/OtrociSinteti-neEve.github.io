<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O.S.E. – Otroci Sintetične Eve</title>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
        }

        /* TABS NAVIGATION */
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-item {
            padding: 12px 24px;
            cursor: pointer;
            color: #888;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-item.active {
            color: #fff;
            border-bottom-color: #ff0000;
        }

        /* SUB TABS */
        .subnav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .subnav-item {
            padding: 8px 16px;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
            font-size: 1rem;
            border: 1px solid transparent;
        }

        .subnav-item:hover {
            color: #fff;
            border-color: #333;
        }

        .subnav-item.active {
            color: #fff;
            border-color: #ff0000;
            background: rgba(255,0,0,0.1);
        }

        /* CONTENT SECTIONS */
        .section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .section.active {
            display: block;
            opacity: 1;
        }

        /* GALLERY */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .gallery img {
            width: 100%;
            max-width: 900px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,0,0,0.1);
        }

        .gallery img:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(255,0,0,0.3);
            border-color: rgba(255,0,0,0.3);
        }

        /* VOLUME CONTENT */
        .volume-content {
            display: none;
        }

        .volume-content.active {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 1000;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(255,0,0,0.2);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 50px;
            cursor: pointer;
            z-index: 1001;
            transition: color 0.3s ease;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        .lightbox-close:hover {
            color: #ff0000;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 50px 20px 30px;
            margin-top: 50px;
            border-top: 1px solid #222;
        }

        .footer-text {
            color: #ff0000;
            font-size: 1.2rem;
            margin-bottom: 15px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .footer-link {
            color: #666;
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 0.95rem;
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 30px;
        }

        .footer-link:hover {
            color: #fff;
            border-color: #ff0000;
            background: rgba(255,0,0,0.1);
        }

        /* GLITCH EFFECT */
        .glitch {
            position: relative;
            display: inline-block;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            animation: glitch-1 0.8s infinite linear alternate-reverse;
            color: #ff0000;
            z-index: -1;
        }

        .glitch::after {
            animation: glitch-2 0.8s infinite linear alternate-reverse;
            color: #00ff00;
            z-index: -2;
        }

        @keyframes glitch-1 {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-2 {
            0% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(2px, 2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(-2px, 2px); }
            100% { transform: translate(0); }
        }

        /* LOADING STATE */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .nav-item {
                padding: 8px 16px;
                font-size: 0.95rem;
            }
            
            .subnav-item {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .lightbox-close {
                top: 20px;
                right: 25px;
                font-size: 40px;
            }
            
            .footer-text {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .nav {
                gap: 5px;
            }
            
            .nav-item {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .subnav {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

        <div class="footer">

        <!-- LIGHTBOX -->
        <div id="lightbox" class="lightbox" onclick="closeLightbox()">
            <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
            <img id="lightbox-img" src="" alt="">
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabId) {
            // Update nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update sections
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        }

        // Volume switching
        function switchVolume(volumeId) {
            // Update subnav items
            document.querySelectorAll('.subnav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update volume content
            document.querySelectorAll('.volume-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(volumeId).classList.add('active');
        }

        // Lightbox functions
        function openLightbox(imgSrc) {
            document.getElementById('lightbox').style.display = 'block';
            document.getElementById('lightbox-img').src = imgSrc;
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-img').src = '';
            document.body.style.overflow = 'auto';
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Touch events for mobile
        document.addEventListener('touchstart', function(e) {
            if (e.target.classList.contains('lightbox')) {
                closeLightbox();
            }
        });
    </script>
