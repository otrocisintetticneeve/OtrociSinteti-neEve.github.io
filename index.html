<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O.S.E. – Otroci Sintetične Eve | OSE Projekt</title>
  <meta name="description" content="O.S.E. (Otroci Sintetične Eve) – telo in tehnologija." />
  <meta name="author" content="O.S.E. – Otroci Sintetične Eve" />
  <link rel="icon" href="lol1.png" type="image/png">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 1100px;
    }

    .title img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 20px;
    }

    /* ----- Zavihki ----- */
    .tabs {
      display: flex;
      justify-content: center;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 24px;
      cursor: pointer;
      color: #ccc;
      transition: color 0.3s, background 0.3s;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .tab.active {
      color: #fff;
      border-bottom: 2px solid #fff;
    }

    .tab:hover {
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ----- Galerija ----- */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      padding: 16px;
    }

    .gallery img {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      text-align: center;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 95%;
      margin: auto;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 8px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
      transition: color 0.3s;
    }

    .close:hover {
      color: #ff4444;
    }

    /* ----- Gumbi ----- */
    .download-section {
      text-align: center;
      margin: 40px 0;
    }

    .download-section a {
      display: inline-block;
      padding: 12px 28px;
      background-color: #333;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      border: 1px solid #555;
      transition: background-color 0.3s, transform 0.2s;
    }

    .download-section a:hover {
      background-color: #555;
      transform: translateY(-2px);
    }

    /* ----- Poezija in Manifesto ----- */
    .content-block {
      text-align: center;
      padding: 60px 20px;
    }

    .content-block h2 {
      font-family: "Garamond", "Times New Roman", serif;
      font-size: 30px;
      margin-bottom: 25px;
      color: #b30000;
      letter-spacing: 0.5px;
    }

    .extra-text {
      text-align: center;
      margin: 10px 0;
      font-size: 16px;
    }

    .extra-text.red {
      color: red;
      font-weight: bold;
    }

    @media (max-width:520px){
      .gallery img { max-width:100%; border-radius:6px; }
      .close{ top:10px; right:15px; font-size:30px; }
      .download-section a { padding:10px 20px; font-size:14px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">
      <img src="lol1.png" alt="O.S.E. – Otroci Sintetične Eve logo" />
    </div>

    <!-- Zavihki -->
    <div class="tabs">
      <div class="tab active" onclick="openTab(event, 'galerija')">Galerija</div>
      <div class="tab" onclick="openTab(event, 'poezija')">Poezija</div>
      <div class="tab" onclick="openTab(event, 'manifesto')">Manifesto</div>
    </div>

    <!-- GALERIJA -->
    <div id="galerija" class="tab-content active">
      <div class="gallery">
        <img src="cc1.png" alt="OSE vizualna serija 1" onclick="openLightbox(this)" />
        <img src="cc2.png" alt="OSE vizualna serija 2" onclick="openLightbox(this)" />
        <img src="cc3.png" alt="OSE vizualna serija 3" onclick="openLightbox(this)" />
        <img src="cc4.png" alt="OSE vizualna serija 4" onclick="openLightbox(this)" />
        <img src="cc5.png" alt="OSE vizualna serija 5" onclick="openLightbox(this)" />
        <img src="ll1.png" alt="OSE vizualna serija 6" onclick="openLightbox(this)" />
        <img src="ll2.png" alt="OSE vizualna serija 7" onclick="openLightbox(this)" />
        <img src="ll3.png" alt="OSE vizualna serija 8" onclick="openLightbox(this)" />
        <img src="ll4.png" alt="OSE vizualna serija 9" onclick="openLightbox(this)" />
        <img src="uu1.png" alt="OSE vizualna serija 10" onclick="openLightbox(this)" />
        <img src="uu2.png" alt="OSE vizualna serija 11" onclick="openLightbox(this)" />
      </div>
    </div>

    <!-- POEZIJA -->
    <div id="poezija" class="tab-content">
      <div class="content-block">
        <h2>Urlik: poezije</h2>
        <div class="download-section">
          <a href="Urlik poezije.docx" download>Prenesi zbirko (Word)</a>
        </div>
      </div>
    </div>

    <!-- MANIFESTO -->
    <div id="manifesto" class="tab-content">
      <div class="content-block">
        <h2>Manifesto</h2>
        <div class="download-section">
          <a href="OTROCI-SINTETIČNE-EV_-manifestoE.pdf" download>Prenesi manifest (PDF)</a>
        </div>
      </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
      <span class="close" onclick="closeLightbox()">&times;</span>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <p class="extra-text">Črna erotika okuži srne</p>
    <p class="extra-text red">otroci.sinteticne.eve@gmail.com</p>
  </div>

  <script>
    function openTab(event, tabId) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function openLightbox(img) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightbox.style.display = 'block';
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      event.stopPropagation();
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
