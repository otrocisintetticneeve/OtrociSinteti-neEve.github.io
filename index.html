<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>O.S.E Otroci Sinteticne Eve</title>
  <meta name="description" content="Črna erotika okuži srne" />
  <meta name="keywords" content="OSE, Otroci Sintetične Eve, umetnost, vizualna galerija, slike, digitalna umetnost, manifest, ose, O.S.E., sekvence, telo, tehnologija" />

  <meta property="og:title" content="O.S.E Otroci Sinteticne Eve" />
  <meta property="og:description" content="Črna erotika okuži srne" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://otrocsinteticneeve.github.io/" />
  <meta property="og:image" content="https://otrocsinteticneeve.github.io/lol1.png" />

  <meta name="theme-color" content="#000000">
  <link rel="icon" href="lol1.png" type="image/png">

  <style>
    html,body{ height:100%; margin:0; }
    body{
      background:#000;
      color:#fff;
      font-family:system-ui, -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:0;
    }
    .wrap{ width:100%; max-width:1100px; }
    .title{ width:100%; margin:0 auto 20px auto; }
    .title img{ width:100%; height:auto; display:block; }
    .gallery{
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:center;
      padding:16px;
    }
    .gallery img{
      width:100%;
      max-width:900px;
      height:auto;
      display:block;
      border-radius:8px;
      box-shadow:0 6px 20px rgba(0,0,0,0.6);
      cursor:pointer;
      transition:transform 0.3s,box-shadow 0.3s;
    }
    .gallery img:hover{
      transform:scale(1.02);
      box-shadow:0 8px 25px rgba(255,255,255,0.1);
    }
    .note{text-align:center;color:#666;font-size:14px;margin:18px 0;}
    .extra-text{text-align:center;margin:10px 0;font-size:16px;}
    .extra-text.red{color:red;font-weight:bold;}
    .pdf-download{text-align:center;margin:20px 0;}
    .pdf-download a{
      display:inline-block;
      padding:12px 24px;
      background-color:#333;
      color:white;
      text-decoration:none;
      border-radius:6px;
      font-size:16px;
      transition:background-color 0.3s,transform 0.2s;
      border:1px solid #555;
    }
    .pdf-download a:hover{background-color:#555;transform:translateY(-2px);}
    .lightbox{
      display:none;
      position:fixed;
      top:0;left:0;width:100%;height:100%;
      background-color:rgba(0,0,0,0.95);
      z-index:1000;text-align:center;
    }
    .lightbox img{
      max-width:95%;
      max-height:95%;
      margin:auto;
      position:absolute;
      top:0;left:0;right:0;bottom:0;
      border-radius:8px;
    }
    .close{
      position:absolute;
      top:20px;right:30px;
      color:white;font-size:40px;font-weight:bold;
      cursor:pointer;z-index:1001;
      transition:color 0.3s;
    }
    .close:hover{color:#ff4444;}
    @media (max-width:520px){
      .gallery img{max-width:100%;border-radius:6px;}
      .lightbox img{max-width:98%;max-height:98%;}
      .close{top:10px;right:15px;font-size:30px;}
      .pdf-download a{padding:10px 20px;font-size:14px;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">
      <img src="lol1.png" alt="O.S.E. — Otroci Sintetične Eve naslov" />
    </div>

    <div class="gallery">
      <img src="cc1.png" alt="vizualna serija 1" onclick="openLightbox(this)" />
      <img src="cc2.png" alt="vizualna serija 2" onclick="openLightbox(this)" />
      <img src="cc3.png" alt="vizualna serija 3" onclick="openLightbox(this)" />
      <img src="cc4.png" alt="vizualna serija 4" onclick="openLightbox(this)" />
      <img src="cc5.png" alt="vizualna serija 5" onclick="openLightbox(this)" />
      <img src="ll1.png" alt="vizualna serija 6" onclick="openLightbox(this)" />
      <img src="ll2.png" alt="vizualna serija 7" onclick="openLightbox(this)" />
      <img src="ll3.png" alt="vizualna serija 8" onclick="openLightbox(this)" />
      <img src="ll4.png" alt="vizualna serija 9" onclick="openLightbox(this)" />
      <img src="uu1.png" alt="vizualna serija 10" onclick="openLightbox(this)" />
      <img src="uu2.png" alt="vizualna serija 11" onclick="openLightbox(this)" />
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
      <span class="close" onclick="closeLightbox()">&times;</span>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <p class="extra-text">Črna erotika okuži srne</p> 
    <div class="pdf-download">
      <a href="OTROCI-SINTETIČNE-EV_-manifestoE.pdf" download>
        Prenesi manifest (PDF)
      </a>
    </div>
    <p class="extra-text red">otroci.sinteticne.eve@gmail.com</p>
  </div>

  <script>
    function openLightbox(img) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightbox.style.display = 'block';
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      event.stopPropagation();
    }
    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }
    document.getElementById('lightbox').addEventListener('click', function(event) {
      if (event.target === this) closeLightbox();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
