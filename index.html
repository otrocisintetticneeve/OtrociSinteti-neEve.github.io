<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O.S.E. – Otroci Sintetične Eve | O.S.E.</title>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        display: flex;
        justify-content: center;
      }

      .wrap {
        width: 100%;
        max-width: 1100px;
      }

      .title img {
        width: 100%;
        margin-bottom: 20px;
      }

      .tabs {
        display: flex;
        justify-content: center;
        border-bottom: 1px solid #333;
        margin-bottom: 20px;
      }

      .tab {
        padding: 12px 24px;
        cursor: pointer;
        color: #ccc;
        transition: 0.3s;
      }

      .tab.active {
        color: #fff;
        border-bottom: 2px solid #fff;
      }

      .tab:hover {
        color: #fff;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .volume-tabs {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }

      .volume-tab {
        cursor: pointer;
        color: #888;
        padding: 8px 14px;
        border-bottom: 1px solid transparent;
        transition: 0.3s;
      }

      .volume-tab:hover {
        color: #fff;
      }

      .volume-tab.active {
        color: #fff;
        border-bottom: 1px solid #fff;
      }

      .gallery img,
      .volume-content img,
      .poezija-gallery img,
      .manifesto-gallery img {
        width: 100%;
        max-width: 900px;
        height: auto;
        display: block;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        cursor: pointer;
        transition: transform 0.35s, box-shadow 0.35s;
      }

      .gallery img:hover,
      .volume-content img:hover,
      .poezija-gallery img:hover,
      .manifesto-gallery img:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 35px rgba(255, 0, 0, 0.2);
      }

      .volume-content {
        display: none;
      }

      .volume-content.active {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
      }

      .poezija-gallery,
      .manifesto-gallery {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
      }

      .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
      }

      .lightbox img {
        max-width: 95%;
        max-height: 95%;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        border-radius: 8px;
      }

      .close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 40px;
        cursor: pointer;
      }

      .footer {
        text-align: center;
        padding: 40px 20px;
        color: #666;
        font-size: 14px;
      }

      .footer a {
        color: #aaa;
        text-decoration: none;
        transition: 0.3s;
      }

      .footer a:hover {
        color: #fff;
      }

      .footer-text {
        color: #ff0000;
        font-size: 16px;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }

      .glitch {
        position: relative;
        display: inline-block;
      }

      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        overflow: hidden;
      }

      .glitch::before {
        animation: glitch1 2s infinite;
        color: #ff0000;
      }

      .glitch::after {
        animation: glitch2 2s infinite;
        color: #ff0000;
      }

      @keyframes glitch1 {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }

      @keyframes glitch2 {
        0% { transform: translate(0); }
        20% { transform: translate(2px, -2px); }
        40% { transform: translate(2px, 2px); }
        60% { transform: translate(-2px, -2px); }
        80% { transform: translate(-2px, 2px); }
        100% { transform: translate(0); }
      }
    </style>
  </head>

    <script>
      function openTab(event,id){
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById(id).classList.add('active');
      }

      function openVolume(event,id){
        document.querySelectorAll('.volume-tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.volume-content').forEach(c=>c.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById(id).classList.add('active');
      }

      function openLightbox(img){
        document.getElementById('lightbox').style.display='block';
        document.getElementById('lightbox-img').src=img.src;
      }

      function closeLightbox(){
        document.getElementById('lightbox').style.display='none';
      }

      document.addEventListener('keydown',function(e){
        if(e.key==='Escape') closeLightbox();
      });
