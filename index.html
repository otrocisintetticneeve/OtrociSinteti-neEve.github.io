<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O.S.E. – Otroci Sintetične Eve | O.S.E.</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  display: flex;
  justify-content: center;
}

.wrap {
  width: 100%;
  max-width: 1100px;
}

.title img {
  width: 100%;
  margin-bottom: 20px;
}

.tabs {
  display: flex;
  justify-content: center;
  border-bottom: 1px solid #333;
  margin-bottom: 20px;
}

.tab {
  padding: 12px 24px;
  cursor: pointer;
  color: #ccc;
  transition: 0.3s;
}

.tab.active {
  color: #fff;
  border-bottom: 2px solid #fff;
}

.tab:hover {
  color: #fff;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* VOLUME TABS */

.volume-tabs {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.volume-tab {
  cursor: pointer;
  color: #888;
  padding: 8px 14px;
  border-bottom: 1px solid transparent;
  transition: 0.3s;
}

.volume-tab:hover {
  color: #fff;
}

.volume-tab.active {
  color: #fff;
  border-bottom: 1px solid #fff;
}

.gallery {
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
}

/* IMAGE EFFECT */

.gallery img,
.volume-content img {
  width: 100%;
  max-width: 900px;
  height: auto;
  display: block;
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}

.gallery img:hover,
.volume-content img:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 25px rgba(255,255,255,0.1);
}

.volume-content {
  display: none;
}

.volume-content.active {
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
}

/* LIGHTBOX */

.lightbox {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.95);
  z-index:1000;
}

.lightbox img {
  max-width:95%;
  max-height:95%;
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  margin:auto;
  border-radius:8px;
}

.close {
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  cursor:pointer;
}

/* INSTAGRAM FOOTER */

.footer {
  text-align: center;
  padding: 40px 20px;
  color: #666;
  font-size: 14px;
}

.footer a {
  color: #aaa;
  text-decoration: none;
  transition: 0.3s;
}

.footer a:hover {
  color: #fff;
}

</style>
</head>

<body>

<div class="wrap">

<div class="title">
<img src="lol1.png">
</div>

<div class="tabs">
<div class="tab active" onclick="openTab(event,'galerija')">Galerija</div>
<div class="tab" onclick="openTab(event,'poezija')">Poezija</div>
<div class="tab" onclick="openTab(event,'manifesto')">Manifesto</div>
</div>

<!-- GALERIJA -->

<div id="galerija" class="tab-content active">

<div class="volume-tabs">
<div class="volume-tab active" onclick="openVolume(event,'novo')">Novo</div>
<div class="volume-tab" onclick="openVolume(event,'vol1')">Vol.1</div>
<div class="volume-tab" onclick="openVolume(event,'vol2')">Vol.2</div>
<div class="volume-tab" onclick="openVolume(event,'vol3')">Vol.3</div>
<div class="volume-tab" onclick="openVolume(event,'vol4')">Vol.4</div>
</div>

<!-- NOVO -->

<div id="novo" class="volume-content active">
<img src="uu12.png" onclick="openLightbox(this)">
<img src="ll7.png" onclick="openLightbox(this)">
<img src="cc6.png" onclick="openLightbox(this)">
</div>

<!-- VOL1 -->

<div id="vol1" class="volume-content">
<img src="cc1.png" onclick="openLightbox(this)">
<img src="cc2.png" onclick="openLightbox(this)">
<img src="cc3.png" onclick="openLightbox(this)">
<img src="cc4.png" onclick="openLightbox(this)">
<img src="cc5.png" onclick="openLightbox(this)">
<img src="ll1.png" onclick="openLightbox(this)">
</div>

<!-- VOL2 -->

<div id="vol2" class="volume-content">
<img src="ll2.png" onclick="openLightbox(this)">
<img src="ll3.png" onclick="openLightbox(this)">
<img src="ll4.png" onclick="openLightbox(this)">
<img src="uu1.png" onclick="openLightbox(this)">
<img src="uu2.png" onclick="openLightbox(this)">
</div>

<!-- VOL3 -->

<div id="vol3" class="volume-content">
<img src="uu4.png" onclick="openLightbox(this)">
<img src="uu5.png" onclick="openLightbox(this)">
<img src="uu6.png" onclick="openLightbox(this)">
<img src="uu7.png" onclick="openLightbox(this)">
<img src="ll5.png" onclick="openLightbox(this)">
<img src="ll6.png" onclick="openLightbox(this)">
</div>

<!-- VOL4 -->

<div id="vol4" class="volume-content">
<img src="uu8.png" onclick="openLightbox(this)">
<img src="uu9.png" onclick="openLightbox(this)">
<img src="uu10.png" onclick="openLightbox(this)">
<img src="uu11.png" onclick="openLightbox(this)">
</div>

</div>

<div id="poezija" class="tab-content">
<div style="padding:60px;text-align:center;">Poezija</div>
</div>

<div id="manifesto" class="tab-content">
<div style="padding:60px;text-align:center;">Manifesto</div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
<span class="close">&times;</span>
<img id="lightbox-img">
</div>

<!-- INSTAGRAM FOOTER -->

<div class="footer">
<a href="https://www.instagram.com/___o.s.e___/" target="_blank">
Instagram — ___o.s.e___
</a>
</div>

</div>

<script>

function openTab(event,id){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
event.currentTarget.classList.add('active');
document.getElementById(id).classList.add('active');
}

function openVolume(event,id){
document.querySelectorAll('.volume-tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.volume-content').forEach(c=>c.classList.remove('active'));
event.currentTarget.classList.add('active');
document.getElementById(id).classList.add('active');
}

function openLightbox(img){
document.getElementById('lightbox').style.display='block';
document.getElementById('lightbox-img').src=img.src;
}

function closeLightbox(){
document.getElementById('lightbox').style.display='none';
}

document.addEventListener('keydown',function(e){
if(e.key==='Escape') closeLightbox();
});

</script>

</body>
</html>
